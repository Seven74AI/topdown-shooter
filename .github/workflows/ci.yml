name: CI

# Designer 2026-11-25: code reaches master through PRs, and the PR run is the gate (it tests the PR merged with
# master). Master runs once per landing to confirm. Other branches get no push runs (builders test locally; open a
# draft PR for CI earlier). Docs / BMAD-only changes skip CI: they go straight to master, no PR. Nothing under
# these paths is linted, typechecked or tested (eslint ignores _bmad*, docs/art; no docs code is in a tsconfig or
# vitest include).
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - ".claude/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - ".claude/**"
      - "**/*.md"
  workflow_dispatch:

# A new push to a PR cancels its older run; a master run is never cancelled (each landed commit gets its result).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI speed-up (designer 2026-11-25; docs/ci.md): static, release, test (4 shards), postgres and docker run in parallel; `gate`
  # is the one check to require. Action versions are pinned to exact releases.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  release:
    # Story 1.11: the release bundle must not contain the dev cheats. Own job so a cheat-string leak fails in ~1 min
    # (release:check = npm run build + the cheat scan with REQUIRE_DIST=1, which fails if dist is missing).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run release:check

  test:
    # 4 shards balanced by LPT on tools/ci/timings.json (tools/ci/shard.mjs). Shard 1 also runs the browser DOM
    # checks (*DomLayout), so only it installs Chromium.
    name: test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Playwright version
        if: matrix.shard == 1
        id: pw
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: matrix.shard == 1
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (+ system deps) for the DOM checks
        if: matrix.shard == 1
        run: npx playwright install --with-deps chromium
      - name: Files of this shard
        run: |
          node tools/ci/shard.mjs ${{ matrix.shard }} 4 > shard-files.txt
          # an empty list would make `vitest run` run every file
          [ -s shard-files.txt ] || { echo "::error::shard ${{ matrix.shard }} has no files"; exit 1; }
          echo "$(wc -l < shard-files.txt) files"; cat shard-files.txt
      - name: Tests
        run: |
          mapfile -t files < shard-files.txt
          npx vitest run --reporter=default --reporter=json --outputFile.json=reports/test-report-${{ matrix.shard }}.json "${files[@]}"
      - name: The browser DOM checks ran (passed, not skipped)
        if: matrix.shard == 1
        run: node tools/ci/check-browser-ran.mjs reports/test-report-1.json
      - name: Slowest 15 tests (job summary); fails if one took over 30 s (E8-A8, docs/ci.md)
        if: always()
        run: |
          [ -f reports/test-report-${{ matrix.shard }}.json ] || { echo "::error::no JSON report"; exit 1; }
          node tools/ci/slowest.mjs reports/test-report-${{ matrix.shard }}.json
      - name: Upload the JSON report (timings refresh, docs/ci.md)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-report-${{ matrix.shard }}
          path: reports/test-report-${{ matrix.shard }}.json
          if-no-files-found: warn

  postgres:
    # Epic 7 retro E7-A1: the real-PostgreSQL tests (realPostgres*.test.ts, realPg.test.ts) skip themselves without
    # TEST_DATABASE_URL, so the test shards skip them; here they run against a postgres:16 service (production is 18;
    # 16 is what the retro asked for and matches the builder boxes). The files share one database and each migrates
    # it, so one file at a time. check-all-passed fails the job if any of them skipped (a lost URL must not go green).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci # a throwaway service on the runner, never a real secret
          POSTGRES_DB: realpg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/realpg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Real-PostgreSQL tests
        run: npx vitest run --no-file-parallelism --reporter=default --reporter=json --outputFile.json=reports/test-report-postgres.json apps/server/src/db/realPostgres apps/server/src/db/realPg.test.ts
      - name: They ran (passed, not skipped)
        run: node tools/ci/check-all-passed.mjs reports/test-report-postgres.json 32
      - name: Slowest tests (job summary); fails if one took over 30 s
        if: always()
        run: node tools/ci/slowest.mjs reports/test-report-postgres.json

  docker:
    # Story 2.2: the VPS images must build. Build only, nothing is pushed: deploys run on the VPS
    # with deploy/deploy.sh (docs/deploy.md). Layers are cached in the GitHub Actions cache (one scope per target);
    # load: true puts the images in the local docker for the smoke test.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_SHA: ci # the compose file refuses to run without it; matches the tags built below
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Throwaway stack secrets (Story 7.1 made the compose file require them; never real ones)
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the server image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/server.Dockerfile
          target: server
          tags: topdown-server:ci
          load: true
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server,ignore-error=true
      - name: Build the web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/server.Dockerfile
          target: web
          tags: topdown-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true
      - name: Caddyfile is valid
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Smoke-test the stack (hardened compose, as on the VPS)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml up -d --no-build --wait --wait-timeout 120
          base=http://127.0.0.1:8080
          for _ in $(seq 1 30); do curl -fsS "$base/api/health" && break; sleep 1; done
          echo
          check() { # check <expected-status> <curl args...>
            local want="$1"; shift
            local got; got="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$@")"
            echo "$got $*"; [ "$got" = "$want" ] || { echo "expected $want"; exit 1; }
          }
          check 200 "$base/api/health"
          check 200 "$base/"
          check 200 "$base/j/ABCD"
          check 404 "$base/api"
          check 404 "$base/assets/nope.js"
          head -c 9000 /dev/zero | tr '\0' a > big.txt
          check 413 -X POST --data-binary @big.txt "$base/api/matchmake/create/run"
          curl -sS -D - -o /dev/null "$base/" | tee headers.txt
          grep -qi '^cache-control: no-cache' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          ! grep -qi '^server:' headers.txt
      - name: Stack status and logs
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml ps -a || true
          docker compose -f deploy/docker-compose.yml logs --no-color --tail=200 || true
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --timeout 20 || true

  gate:
    # The single required check: green only if every job above succeeded (a failed, cancelled or skipped job fails it).
    needs: [static, release, test, postgres, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null || { echo "::error::a required job did not succeed"; exit 1; }
