name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Story 1.11: the release bundle must not contain the dev cheats (fails if dist is missing).
      - run: npx vitest run tools/checks/noCheatsInRelease.test.ts
        env: { REQUIRE_DIST: "1" }

  docker:
    # Story 2.2: the VPS images must build. Build only, nothing is pushed: deploys run on the VPS
    # with deploy/deploy.sh (docs/deploy.md).
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/server.Dockerfile --target server -t topdown-server:ci .
      - run: docker build -f deploy/server.Dockerfile --target web -t topdown-web:ci .
      - name: Caddyfile is valid
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile

  pages:
    # TEMPORARY (designer's Epic 1 playtest links point at GitHub Pages): keep publishing the client
    # there until the VPS deploy (Story 2.2, Task 9) is live and verified; then delete this job and
    # `deploy-pages`, and disable Pages in the repo settings. Pages has no game server: online play
    # shows "Can't reach the server" there; solo play works.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { BASE_PATH: /topdown-shooter/ }
      - uses: actions/upload-pages-artifact@v5
        with: { path: apps/client/dist }

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: pages
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    concurrency: { group: pages, cancel-in-progress: false }
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
