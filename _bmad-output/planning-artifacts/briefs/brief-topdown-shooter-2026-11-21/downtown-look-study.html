<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Downtown look study (Story 4.9)</title>
<style>

  #looks { display: flex; gap: 6px; pointer-events: auto; }
  #looks button { font: 700 13px system-ui, sans-serif; color: #e8e4dc; background: rgba(20,22,26,0.78); border: 1px solid rgba(232,228,220,0.28); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #looks button[aria-pressed="true"] { background: #e2553a; border-color: #e2553a; color: #fff; }
  #label { margin-top: 6px; background: rgba(10,11,13,0.62); padding: 4px 8px; border-radius: 6px; display: inline-block; }
  #label b { color: #fff; }
  #desc { font-weight: 400; font-size: 12px; opacity: 0.85; }
  #hint { font-weight: 400; font-size: 11px; opacity: 0.6; margin-top: 2px; }
  @media (max-height: 480px) { #ui { font-size: 11px; } #looks button { font-size: 11px; padding: 3px 7px; } #desc { display: none; } #label { margin-top: 4px; padding: 2px 6px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="looks">
    <button id="b1" aria-pressed="false">1 Readable</button>
    <button id="b2" aria-pressed="false">2 Dead City</button>
    <button id="b3" aria-pressed="false">3 + Outline aid</button>
  </div>
  <div id="label"><b id="name"></b> <span id="desc"></span><div id="hint">1/2/3 to switch, WASD/touch to move <span id="fps"></span></div></div>
</div>
<script>
(() => {
'use strict';
// ---------------------------------------------------------------------------
// Map data, inlined from apps/client/public/assets/maps/downtown.tmj (world px, 32 px = 1 m)
// ---------------------------------------------------------------------------
const MAP = {"w":1536,"h":1024,"collision":[{"n":"nw_corner_shop","x":0,"y":0,"w":256,"h":320},{"n":"nw_apartments","x":352,"y":0,"w":224,"h":320},{"n":"gas_kiosk","x":1312,"y":0,"w":224,"h":192},{"n":"gas_pump_a","x":1040,"y":112,"w":64,"h":32},{"n":"gas_pump_b","x":1040,"y":224,"w":64,"h":32},{"n":"city_bus","x":960,"y":464,"w":320,"h":80},{"n":"sw_diner","x":0,"y":704,"w":224,"h":320},{"n":"parking_wall","x":320,"y":768,"w":16,"h":256},{"n":"se_offices","x":960,"y":704,"w":256,"h":320},{"n":"se_warehouse","x":1312,"y":704,"w":224,"h":320}],"cover":[{"n":"bus_hull","x":960,"y":464,"w":320,"h":80,"k":"bus"},{"n":"parked_car_1","x":368,"y":832,"w":64,"h":144,"k":"car"},{"n":"parked_car_2","x":464,"y":832,"w":64,"h":144,"k":"car"},{"n":"parked_car_3","x":560,"y":832,"w":64,"h":144,"k":"car"},{"n":"street_car_west","x":128,"y":416,"w":144,"h":64,"k":"car"},{"n":"street_car_east","x":1344,"y":560,"w":144,"h":64,"k":"car"},{"n":"police_barrier_north","x":672,"y":192,"w":192,"h":16,"k":"barrier","s":2},{"n":"sandbags_south","x":720,"y":720,"w":96,"h":32,"k":"sandbags","s":3}],"spawns":[{"n":"street_west","x":16,"y":512,"s":1},{"n":"street_east","x":1520,"y":512,"s":1},{"n":"street_north","x":768,"y":16,"s":1},{"n":"street_south","x":768,"y":1008,"s":1},{"n":"alley_1_mouth","x":304,"y":16,"s":1},{"n":"alley_2_mouth","x":272,"y":1008,"s":1},{"n":"alley_3_mouth","x":1264,"y":1008,"s":1},{"n":"gas_station_north","x":1200,"y":16,"s":1},{"n":"parking_lot_south","x":480,"y":1008,"s":1}],"hazards":[{"n":"gas_leak_zone","x":992,"y":64,"w":192,"h":240,"k":"gas_leak","s":2},{"n":"fire_parked_car_2","x":432,"y":800,"w":128,"h":208,"k":"fire","s":3},{"n":"fire_street_car_west","x":96,"y":384,"w":208,"h":128,"k":"fire","s":3}],"stage1_ground":[{"n":"sidewalk_nw","x":0,"y":320,"w":640,"h":64,"k":"sidewalk"},{"n":"sidewalk_nw_east","x":576,"y":0,"w":64,"h":320,"k":"sidewalk"},{"n":"sidewalk_sw","x":0,"y":640,"w":640,"h":64,"k":"sidewalk"},{"n":"sidewalk_se","x":896,"y":640,"w":640,"h":64,"k":"sidewalk"},{"n":"sidewalk_se_west","x":896,"y":704,"w":64,"h":320,"k":"sidewalk"},{"n":"gas_forecourt","x":896,"y":0,"w":640,"h":384,"k":"forecourt"},{"n":"parking_lot","x":336,"y":704,"w":304,"h":320,"k":"lot"},{"n":"crosswalk_north","x":640,"y":336,"w":256,"h":48,"k":"crosswalk"},{"n":"crosswalk_south","x":640,"y":640,"w":256,"h":48,"k":"crosswalk"},{"n":"crosswalk_west","x":592,"y":384,"w":48,"h":256,"k":"crosswalk"},{"n":"crosswalk_east","x":896,"y":384,"w":48,"h":256,"k":"crosswalk"},{"n":"lane_west","x":32,"y":508.8,"w":544,"h":6.4,"k":"lane"},{"n":"lane_east","x":1312,"y":508.8,"w":208,"h":6.4,"k":"lane"},{"n":"lane_north","x":764.8,"y":16,"w":6.4,"h":304,"k":"lane"},{"n":"lane_south","x":764.8,"y":704,"w":6.4,"h":304,"k":"lane"},{"n":"gas_canopy","x":992,"y":64,"w":192,"h":240,"k":"canopy"}],"stage2_props":[{"n":"debris_west","x":160,"y":576,"w":32,"h":25.6,"k":"debris"},{"n":"debris_east","x":1408,"y":416,"w":38.4,"h":25.6,"k":"debris"}],"stage3_props":[{"n":"debris_mid","x":480,"y":448,"w":48,"h":32,"k":"debris"},{"n":"debris_south","x":832,"y":864,"w":32,"h":32,"k":"debris"}],"stage4_props":[],"stage5_props":[]};
const PPM = 32, VIEW_W = 24, VIEW_H = 13.5, MAX_DPR = 2;   // camera.ts + constants.ts + display.ts
const WW = MAP.w, WH = MAP.h;
const PLAYER_R = 0.4 * PPM, SPEED = 4.5 * PPM;              // balance/player.json
const LOOKS = {
  A: { name: 'A · Readable', desc: 'Cast shadows, bevelled roofs, crisp outlines on a dark night palette.' },
  B: { name: 'B · Dead City', desc: 'A + wet asphalt, streetlight pools, shop glow, rain, vignette.' },
  C: { name: 'C · Dead City + outline aid', desc: 'B + a thin rim on every solid edge (white: stops bullets, amber: stops bodies only).' }
};
const KEYS = ['A', 'B', 'C'];

// Solids for movement: collision ∪ cover (Story 4.2: all four cover kinds block movement).
const SOLIDS = [];
{ const seen = new Set();
  for (const o of MAP.collision.concat(MAP.cover)) {
    const key = o.x + ',' + o.y + ',' + o.w + ',' + o.h; if (seen.has(key)) continue; seen.add(key);
    SOLIDS.push({ n: o.n, k: o.k, x: o.x, y: o.y, w: o.w, h: o.h, bullets: !(o.k === 'barrier' || o.k === 'sandbags') });
  } }
const G = MAP.stage1_ground;
const ofKind = k => G.filter(o => o.k === k);
const byName = n => MAP.collision.concat(MAP.cover, G, MAP.hazards).find(o => o.n === n);
const BUILDINGS = ['nw_corner_shop', 'nw_apartments', 'gas_kiosk', 'sw_diner', 'se_offices', 'se_warehouse'].map(byName);

// Heights (m) only drive shadow length: one light direction for everything (upper-left).
const HEIGHT_M = { nw_corner_shop: 7, nw_apartments: 14, gas_kiosk: 4, sw_diner: 5, se_offices: 18, se_warehouse: 9,
  gas_pump_a: 1.8, gas_pump_b: 1.8, city_bus: 3.2, parking_wall: 1.1, car: 1.5, barrier: 0.9, sandbags: 0.6 };
const LDIR = { x: 0.55, y: 0.83 };
const shadowLen = o => Math.min(60, (HEIGHT_M[o.n] || HEIGHT_M[o.k] || 2) * 5.5);

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { const s = Math.sin(n) * 43758.5453; return s - Math.floor(s); }
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function ell(c, x, y, rx, ry, a) { c.beginPath(); c.ellipse(x, y, rx, ry, a || 0, 0, Math.PI * 2); }
function rgbOf(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(h, t) { const c = rgbOf(h), f = t < 0 ? 0 : 255, a = Math.abs(t); return `rgb(${c.map(v => Math.round(v + (f - v) * a)).join(',')})`; }
// Soft shadow: draw shape far off-canvas and let shadowOffset bring the blurred shadow back.
const OFF = 20000;
function softShadow(g, blur, color, drawFn) {
  const s = g.__s; g.save();
  g.shadowColor = color; g.shadowBlur = blur * s; g.shadowOffsetX = OFF * s; g.shadowOffsetY = 0;
  g.translate(-OFF, 0); g.fillStyle = '#000'; drawFn(); g.restore();
}
// Cast shadow of an axis-aligned box swept along the light direction.
function boxShadowPath(g, x, y, w, h, len) {
  const dx = LDIR.x * len, dy = LDIR.y * len;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y); g.lineTo(x + w + dx, y + dy); g.lineTo(x + w + dx, y + h + dy);
  g.lineTo(x + dx, y + h + dy); g.lineTo(x, y + h); g.closePath();
}
function castBoxShadow(g, x, y, w, h, len, alpha) {
  softShadow(g, Math.max(1.5, len * 0.22), `rgba(0,0,0,${alpha})`, () => { boxShadowPath(g, x, y, w, h, len); g.fill(); });
  // contact shadow: tight dark band right at the footprint
  softShadow(g, 2.5, 'rgba(0,0,0,0.6)', () => { g.fillRect(x - 1, y - 1, w + 2, h + 2); });
}
// Raised top face: bevel lit from upper-left + crisp outline.
function bevel(g, x, y, w, h, b, hi, lo) {
  g.fillStyle = hi; g.fillRect(x, y, w, b); g.fillRect(x, y, b, h);
  g.fillStyle = lo; g.fillRect(x, y + h - b, w, b); g.fillRect(x + w - b, y, b, h);
}
function outline(g, x, y, w, h, lw) { g.strokeStyle = '#08080a'; g.lineWidth = lw || 1.6; g.strokeRect(x, y, w, h); }
function subtract(iv, a, b) { const out = []; for (const [p, q] of iv) { if (b <= p || a >= q) { out.push([p, q]); continue; } if (a > p) out.push([p, a]); if (b < q) out.push([b, q]); } return out; }

// ---------------------------------------------------------------------------
// Static layer: ground
// ---------------------------------------------------------------------------
const PAL = {
  asphalt: '#1c1d20', alley: '#161719', sidewalk: '#2d2d2e', joint: 'rgba(0,0,0,0.32)', curb: '#4b4b48',
  forecourt: '#28292a', lot: '#1e1f22', lane: 'rgba(190,160,60,0.45)', zebra: 'rgba(205,205,195,0.28)', lotLine: 'rgba(205,205,195,0.3)'
};
const ALLEYS = [{ x: 256, y: 0, w: 96, h: 320 }, { x: 224, y: 704, w: 96, h: 320 }, { x: 1216, y: 704, w: 96, h: 320 }];

function drawGround(g, R) {
  g.fillStyle = PAL.asphalt; g.fillRect(0, 0, WW, WH);
  g.fillStyle = PAL.alley; for (const a of ALLEYS) g.fillRect(a.x, a.y, a.w, a.h);
  // asphalt grain (low contrast)
  for (let i = 0; i < 26000; i++) { g.fillStyle = R() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.16)'; g.fillRect(R() * WW, R() * WH, 1.3, 1.3); }
  // patch repairs
  for (let i = 0; i < 22; i++) { g.fillStyle = R() > 0.5 ? 'rgba(255,255,255,0.012)' : 'rgba(0,0,0,0.06)'; g.fillRect(R() * WW, R() * WH, 30 + R() * 90, 20 + R() * 50); }
  // forecourt concrete slabs
  for (const f of ofKind('forecourt')) {
    g.fillStyle = PAL.forecourt; g.fillRect(f.x, f.y, f.w, f.h);
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1; g.beginPath();
    for (let x = f.x; x <= f.x + f.w; x += 96) { g.moveTo(x, f.y); g.lineTo(x, f.y + f.h); }
    for (let y = f.y; y <= f.y + f.h; y += 96) { g.moveTo(f.x, y); g.lineTo(f.x + f.w, y); }
    g.stroke();
    for (let i = 0; i < 9000; i++) { g.fillStyle = R() > 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.12)'; g.fillRect(f.x + R() * f.w, f.y + R() * f.h, 1.2, 1.2); }
    for (let i = 0; i < 14; i++) { g.fillStyle = 'rgba(0,0,0,0.22)'; ell(g, f.x + R() * f.w, f.y + R() * f.h, 6 + R() * 16, 4 + R() * 10, R() * 3); g.fill(); }
    // flush apron edge
    g.strokeStyle = 'rgba(255,255,255,0.07)'; g.lineWidth = 2; g.strokeRect(f.x + 1, f.y + 1, f.w - 2, f.h - 2);
  }
  // parking lot
  for (const l of ofKind('lot')) {
    g.fillStyle = PAL.lot; g.fillRect(l.x, l.y, l.w, l.h);
    for (let i = 0; i < 4000; i++) { g.fillStyle = R() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.15)'; g.fillRect(l.x + R() * l.w, l.y + R() * l.h, 1.3, 1.3); }
    g.fillStyle = PAL.lotLine;
    for (let x = 352; x <= 640; x += 96) g.fillRect(x - 1.5, 800, 3, 192);
    g.fillRect(352, 990, 288, 3);
  }
  // sidewalks: paver slabs
  const sw = ofKind('sidewalk');
  for (const s of sw) {
    g.fillStyle = PAL.sidewalk; g.fillRect(s.x, s.y, s.w, s.h);
    for (let i = 0; i < s.w * s.h / 18; i++) { g.fillStyle = R() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.12)'; g.fillRect(s.x + R() * s.w, s.y + R() * s.h, 1.2, 1.2); }
    g.strokeStyle = PAL.joint; g.lineWidth = 1; g.beginPath();
    for (let x = s.x; x <= s.x + s.w; x += 32) { g.moveTo(x, s.y); g.lineTo(x, s.y + s.h); }
    for (let y = s.y; y <= s.y + s.h; y += 32) { g.moveTo(s.x, y); g.lineTo(s.x + s.w, y); }
    g.stroke();
    for (let i = 0; i < s.w * s.h / 4000; i++) { g.fillStyle = 'rgba(0,0,0,0.1)'; g.fillRect(s.x + Math.floor(R() * s.w / 32) * 32, s.y + Math.floor(R() * s.h / 32) * 32, 32, 32); }
  }
  // curbs: sidewalk edges that face road or lot (edges that touch buildings / other sidewalks / map border are skipped)
  const blockers = sw.concat(BUILDINGS);
  for (const s of sw) {
    const edges = [{ o: 'h', c: s.y, a: s.x, b: s.x + s.w, side: -1 }, { o: 'h', c: s.y + s.h, a: s.x, b: s.x + s.w, side: 1 },
                   { o: 'v', c: s.x, a: s.y, b: s.y + s.h, side: -1 }, { o: 'v', c: s.x + s.w, a: s.y, b: s.y + s.h, side: 1 }];
    for (const e of edges) {
      if (e.c <= 0 || e.c >= (e.o === 'h' ? WH : WW)) continue;
      let iv = [[e.a, e.b]];
      for (const q of blockers) {
        if (q === s) continue;
        const [qa, qb, c1, c2] = e.o === 'h' ? [q.x, q.x + q.w, q.y, q.y + q.h] : [q.y, q.y + q.h, q.x, q.x + q.w];
        const probe = e.c + e.side;
        if (probe > c1 && probe < c2) iv = subtract(iv, qa, qb);
      }
      for (const [a, b] of iv) {
        if (b - a < 2) continue;
        const inS = -e.side; // direction into the sidewalk
        if (e.o === 'h') {
          g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(a, e.side < 0 ? e.c - 4 : e.c, b - a, 4);                 // gutter
          g.fillStyle = PAL.curb; g.fillRect(a, e.side < 0 ? e.c : e.c - 4, b - a, 4);                           // curb top
          g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(a, e.side < 0 ? e.c : e.c - 1, b - a, 1);
        } else {
          g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(e.side < 0 ? e.c - 4 : e.c, a, 4, b - a);
          g.fillStyle = PAL.curb; g.fillRect(e.side < 0 ? e.c : e.c - 4, a, 4, b - a);
          g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(e.side < 0 ? e.c : e.c - 1, a, 1, b - a);
        }
        void inS;
      }
    }
  }
  // lane dashes
  g.fillStyle = PAL.lane;
  for (const l of ofKind('lane')) {
    if (l.w > l.h) for (let x = l.x; x < l.x + l.w; x += 112) g.fillRect(x, l.y, Math.min(64, l.x + l.w - x), l.h);
    else for (let y = l.y; y < l.y + l.h; y += 112) g.fillRect(l.x, y, l.w, Math.min(64, l.y + l.h - y));
  }
  // crosswalk zebra stripes (worn)
  for (const z of ofKind('crosswalk')) {
    for (let i = 0; ; i++) {
      const horiz = z.w > z.h, p = 8 + i * 24; if (p + 12 > (horiz ? z.w : z.h)) break;
      g.fillStyle = PAL.zebra;
      if (horiz) g.fillRect(z.x + p, z.y + 4, 12, z.h - 8); else g.fillRect(z.x + 4, z.y + p, z.w - 8, 12);
    }
    for (let i = 0; i < z.w * z.h / 90; i++) { g.fillStyle = 'rgba(28,29,32,0.55)'; g.fillRect(z.x + R() * z.w, z.y + R() * z.h, 1.5, 1.5); }
  }
  // cracks
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 1;
  for (let i = 0; i < 70; i++) { let x = R() * WW, y = R() * WH; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (R() - 0.5) * 34; y += (R() - 0.5) * 34; g.lineTo(x, y); } g.stroke(); }
  // manholes + storm drains (flat)
  for (const [x, y] of [[700, 450], [840, 590], [1360, 470], [420, 470], [770, 860], [770, 170]]) {
    g.fillStyle = '#18191b'; circle(g, x, y, 11); g.fill(); g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 1.2; g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); for (let k = -6; k <= 6; k += 4) { g.moveTo(x - 8, y + k); g.lineTo(x + 8, y + k); } g.stroke();
  }
  for (const [x, y, v] of [[200, 384, 0], [500, 384, 0], [200, 636, 0], [520, 636, 0], [1100, 636, 0], [1450, 636, 0], [636, 200, 1], [900, 840, 1]]) {
    g.fillStyle = '#0e0e10'; v ? g.fillRect(x - 3, y - 12, 6, 24) : g.fillRect(x - 12, y - 3, 24, 6);
  }
  // skid marks to the bus (it slid in from the east)
  g.strokeStyle = 'rgba(0,0,0,0.38)'; g.lineWidth = 5;
  for (const yy of [478, 530]) { g.beginPath(); g.moveTo(1290, yy + 4); g.bezierCurveTo(1380, yy + 10, 1450, yy + 30, 1530, yy + 46); g.stroke(); }
  // broken glass from the crashed front
  for (let i = 0; i < 90; i++) { g.fillStyle = R() > 0.5 ? 'rgba(170,190,205,0.35)' : 'rgba(120,140,160,0.25)'; g.fillRect(900 + R() * 58, 470 + R() * 70, 1.6, 1.6); }
  // litter (flat flecks)
  for (let i = 0; i < 160; i++) { g.fillStyle = R() > 0.6 ? 'rgba(0,0,0,0.35)' : 'rgba(190,185,170,0.14)'; const x = R() * WW, y = R() * WH; g.fillRect(x, y, 3 + R() * 4, 2 + R() * 2); }
}

function wetGround(g, R) {
  // overall cool, wet tint on the floor + specular grain + puddles (flat, no rims that read as solid)
  g.fillStyle = 'rgba(40,60,90,0.10)'; g.fillRect(0, 0, WW, WH);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(150,175,205,${0.03 + R() * 0.05})`; g.fillRect(R() * WW, R() * WH, 1 + R() * 2.5, 1); }
  for (let i = 0; i < 46; i++) {
    const x = R() * WW, y = R() * WH, rx = 18 + R() * 46, ry = 7 + R() * 16, a = R() * 0.6 - 0.3;
    const gr = g.createRadialGradient(x, y, 0, x, y, rx); gr.addColorStop(0, 'rgba(70,92,120,0.42)'); gr.addColorStop(0.8, 'rgba(60,80,105,0.28)'); gr.addColorStop(1, 'rgba(60,80,105,0)');
    g.fillStyle = gr; ell(g, x, y, rx, ry, a); g.fill();
    g.fillStyle = 'rgba(190,210,230,0.10)'; ell(g, x - rx * 0.2, y - ry * 0.25, rx * 0.4, ry * 0.18, a); g.fill();
  }
}

// ---------------------------------------------------------------------------
// Static layer: obstacles
// ---------------------------------------------------------------------------
const ROOF = { nw_corner_shop: '#5b544b', nw_apartments: '#51535a', gas_kiosk: '#5a5d59', sw_diner: '#5d5048', se_offices: '#55595e', se_warehouse: '#5e5850' };

function roofBox(g, x, y, w, h, col, hgt) {
