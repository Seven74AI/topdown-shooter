# Story 2.2: the game on the VPS. Run through deploy/deploy.sh (it sets GIT_SHA); see docs/deploy.md.
# Cloudflare Tunnel `sevend-io-stream` -> 127.0.0.1:8080 (web: Caddy) -> server:2567 (game server).
# PostgreSQL joins in Epic 7 (Story 7.1).
name: topdown

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      target: server
    image: topdown-server:${GIT_SHA:-dev}
    restart: unless-stopped
    init: true # SIGTERM reaches Node, which closes rooms with "Server restarting"
    stop_grace_period: 20s
    environment:
      PORT: "2567"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://hordes.sevend.io}
      LOG_LEVEL: info
      GIT_SHA: ${GIT_SHA:-dev}
    expose: ["2567"] # never published to the host: only Caddy reaches it
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2567/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      target: web
    image: topdown-web:${GIT_SHA:-dev}
    restart: unless-stopped
    ports: ["${WEB_BIND:-127.0.0.1:8080}:8080"] # where the tunnel already points
    depends_on:
      server:
        condition: service_healthy
    logging: *logging
