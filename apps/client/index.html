<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <!-- Story 10.5 (B2, Q2 "Hordes"): home-screen install. No service worker (B1). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hordes" />
    <title>Hordes</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game,
      #ui {
        position: fixed;
        inset: 0;
      }
      #ui {
        pointer-events: none;
      }
      /* Keyboard + mouse mode (Story 1.10); touch mode keeps the default cursor. */
      #game.mouse-mode {
        cursor: crosshair;
      }
      /* Story 10.4 (10.4-Q1 = B, designer 2026-11-27; title "Hordes", 10.5-Q2): the loading screen, drawn before any script arrives; removed by main.ts at the first screen. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      .bl__title {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        text-align: center;
        font-size: 32px;
        line-height: 1;
      }
      .bl__bar,
      .bl__line {
        position: absolute;
        left: 50%;
        top: calc(50% + 34px);
      }
      .bl__bar {
        width: 240px;
        height: 4px;
        margin-left: -120px;
        background: #3b4048;
        overflow: hidden;
      }
      .bl__fill {
        height: 100%;
        background: #f59e2c;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.2s linear;
      }
      .bl__line {
        top: calc(50% + 50px);
        width: 300px;
        margin-left: -150px;
        text-align: center;
        font-size: 13px;
        color: #8f97a2;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="boot-loader" data-progress="0">
      <div class="bl__title">Hordes</div>
      <div class="bl__bar"><div class="bl__fill"></div></div>
      <div class="bl__line">Downloading…</div>
    </div>
    <!-- boot-loader-script -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
